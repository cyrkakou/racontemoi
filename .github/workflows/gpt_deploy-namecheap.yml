name: Deploy to Namecheap

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: namecheap-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    env:
      NODE_VERSION: "22"
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      APP_URL: ${{ vars.APP_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: |
          npm run lint
          npm run typecheck

      - name: Build cPanel standalone output
        run: npm run build:cpanel

      - name: Validate deployment inputs
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail

          required_values=(
            DEPLOY_PATH
            SSH_HOST
            SSH_PORT
            SSH_USER
            SSH_PRIVATE_KEY
          )

          for variable_name in "${required_values[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "Missing required GitHub secret or variable: ${variable_name}" >&2
              exit 1
            fi
          done

          if [[ ! "${SSH_PORT}" =~ ^[0-9]+$ ]]; then
            echo "SSH_PORT must contain only digits." >&2
            exit 1
          fi

          if [[ "${DEPLOY_PATH}" != /* || "${DEPLOY_PATH}" == "/" ]]; then
            echo "DEPLOY_PATH must be a non-root absolute path." >&2
            exit 1
          fi

      - name: Prepare runtime artifact
        shell: bash
        run: |
          set -Eeuo pipefail

          artifact_root="${RUNNER_TEMP}/namecheap-runtime"
          archive_path="${RUNNER_TEMP}/racontemoi-${GITHUB_SHA}.tar.gz"

          mkdir -p "${artifact_root}/.next"
          cp app.js "${artifact_root}/app.js"
          cp -a .next/standalone "${artifact_root}/.next/standalone"

          test -f "${artifact_root}/app.js"
          test -f "${artifact_root}/.next/standalone/server.js"
          test -f "${artifact_root}/.next/standalone/public/proof-mark.svg"
          test -d "${artifact_root}/.next/standalone/.next/static"

          tar -C "${artifact_root}" -czf "${archive_path}" .
          echo "DEPLOY_ARCHIVE=${archive_path}" >> "${GITHUB_ENV}"

      - name: Resolve public application URL
        shell: bash
        run: |
          set -Eeuo pipefail

          public_url="${APP_URL%/}"
          if [[ -z "${public_url}" ]]; then
            candidate_domain="$(basename "${DEPLOY_PATH%/}")"
            if [[ "${candidate_domain}" == *.* ]]; then
              public_url="https://${candidate_domain}"
              echo "::notice::APP_URL is not set; using ${public_url} from DEPLOY_PATH."
            fi
          fi

          echo "PUBLIC_URL=${public_url}" >> "${GITHUB_ENV}"

      - name: Configure SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/namecheap_deploy_key"

          if [[ -n "${SSH_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "${SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          else
            echo "::warning::SSH_KNOWN_HOSTS is not configured. Using ssh-keyscan temporarily for Phase 0 testing."
            ssh-keyscan -H -p "${SSH_PORT}" "${SSH_HOST}" > "${HOME}/.ssh/known_hosts"
          fi

          chmod 600 "${HOME}/.ssh/namecheap_deploy_key" "${HOME}/.ssh/known_hosts"

          cat > "${HOME}/.ssh/config" <<EOF
          Host namecheap-deploy
            HostName ${SSH_HOST}
            User ${SSH_USER}
            Port ${SSH_PORT}
            IdentityFile ${HOME}/.ssh/namecheap_deploy_key
            UserKnownHostsFile ${HOME}/.ssh/known_hosts
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
          EOF
          chmod 600 "${HOME}/.ssh/config"

          ssh namecheap-deploy 'printf "SSH connection established.\n"'

      - name: Upload runtime artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          scp "${DEPLOY_ARCHIVE}" \
            "namecheap-deploy:./.racontemoi-${GITHUB_SHA}.tar.gz"

      - name: Activate release and restart Passenger
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh namecheap-deploy bash -s -- "${DEPLOY_PATH}" "${GITHUB_SHA}" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          requested_path="$1"
          release_sha="$2"
          deploy_path="$(realpath -m "${requested_path}")"
          archive_path="${HOME}/.racontemoi-${release_sha}.tar.gz"
          staging_path="${HOME}/.racontemoi-staging-${release_sha}"

          cleanup() {
            rm -rf -- "${staging_path}"
            rm -f -- "${archive_path}"
          }
          trap cleanup EXIT

          case "${deploy_path}" in
            "${HOME}"/*) ;;
            *)
              echo "DEPLOY_PATH must resolve below the SSH home directory." >&2
              exit 1
              ;;
          esac

          command -v rsync >/dev/null
          test -f "${archive_path}"

          mkdir -p "${staging_path}"
          tar -xzf "${archive_path}" -C "${staging_path}"

          test -f "${staging_path}/app.js"
          test -f "${staging_path}/.next/standalone/server.js"
          test -d "${staging_path}/.next/standalone/.next/static"

          mkdir -p "${deploy_path}/tmp"
          mkdir -p "${deploy_path}/.next/standalone"

          # Limit deletion to the generated runtime tree. Files created by cPanel
          # in the application root (especially .htaccess/Passenger metadata)
          # must survive every deployment.
          rsync -a --delete \
            "${staging_path}/.next/standalone/" \
            "${deploy_path}/.next/standalone/"
          install -m 644 "${staging_path}/app.js" "${deploy_path}/app.js"

          test -f "${deploy_path}/app.js"
          test -f "${deploy_path}/.next/standalone/server.js"

          # A restart.txt file only recycles an application that Passenger is
          # already managing. CloudLinux Selector is also able to start an app
          # that cPanel currently reports as stopped.
          selector_bin="$(command -v cloudlinux-selector || true)"
          app_root="${deploy_path#"${HOME}/"}"
          selector_user="$(id -un)"
          app_domain="${deploy_path##*/}"

          if [[ -n "${selector_bin}" ]]; then
            if ! "${selector_bin}" restart --json \
              --interpreter nodejs \
              --user "${selector_user}" \
              --app-root "${app_root}"; then
              if ! "${selector_bin}" start --json \
                --interpreter nodejs \
                --user "${selector_user}" \
                --app-root "${app_root}"; then
                "${selector_bin}" destroy --json \
                  --interpreter nodejs \
                  --domain "${app_domain}" \
                  --app-root "${app_root}" || true
                "${selector_bin}" create --json \
                  --interpreter nodejs \
                  --domain "${app_domain}" \
                  --app-root "${app_root}" \
                  --app-uri '/' \
                  --version 22 \
                  --app-mode production \
                  --startup-file app.js
                "${selector_bin}" start --json \
                  --interpreter nodejs \
                  --domain "${app_domain}" \
                  --app-root "${app_root}"
              fi
            fi
          else
            echo 'cloudlinux-selector is unavailable; falling back to Passenger restart.txt.' >&2
          fi

          # Apply this after CloudLinux Selector because starting an app may
          # regenerate cPanel's Passenger directives. Preserve those directives
          # and replace only our own idempotent security block.
          htaccess_path="${deploy_path}/.htaccess"
          htaccess_body="${deploy_path}/.htaccess.gpt-body"
          htaccess_next="${deploy_path}/.htaccess.gpt-next"
          security_begin='# GPT MANAGED SECURITY BEGIN'
          security_end='# GPT MANAGED SECURITY END'

          if [[ -f "${htaccess_path}" ]]; then
            awk -v begin="${security_begin}" -v end="${security_end}" '
              $0 == begin { managed = 1; next }
              $0 == end { managed = 0; next }
              !managed { print }
            ' "${htaccess_path}" > "${htaccess_body}"
          else
            : > "${htaccess_body}"
          fi

          {
            cat <<'HTACCESS_SECURITY'
          # GPT MANAGED SECURITY BEGIN
          Options -Indexes
          <FilesMatch "(^\.|^app\.js$|^server\.js$|^package(-lock)?\.json$|^next\.config\.|^tsconfig)">
            Require all denied
          </FilesMatch>
          # GPT MANAGED SECURITY END
          HTACCESS_SECURITY
            cat "${htaccess_body}"
          } > "${htaccess_next}"

          mv -f "${htaccess_next}" "${htaccess_path}"
          rm -f "${htaccess_body}"
          chmod 644 "${htaccess_path}"

          touch "${deploy_path}/tmp/restart.txt"
          printf 'Deployed commit %s and started/restarted Passenger.\n' "${release_sha}"
          REMOTE_SCRIPT

      - name: Verify public health endpoint
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${PUBLIC_URL:-}" ]]; then
            echo "::warning::Public health check skipped because APP_URL is unset and DEPLOY_PATH does not end with a domain."
            exit 0
          fi

          health_url="${PUBLIC_URL}/api/health"
          echo "Waiting for Passenger to recycle the application process..."
          sleep 15
          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --location \
            --retry 36 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 10 \
            --max-time 30 \
            "${health_url}"

      - name: Deployment summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Namecheap deployment"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Trigger: \`${GITHUB_EVENT_NAME}\`"
            if [[ -n "${PUBLIC_URL:-}" ]]; then
              echo "- Health check: \`${PUBLIC_URL}/api/health\`"
            else
              echo "- Health check skipped: no public URL could be resolved."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
